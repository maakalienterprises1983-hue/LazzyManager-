
name: Build Lazzy Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -q LazzyManager.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Locate project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
  
      - name: Fix Android Manifest
        run: |
          python3 - <<'PY'
          import os
          p = os.path.join(os.environ["PROJECT_DIR"], "app/src/main/AndroidManifest.xml")
          with open(p, "r", encoding="utf-8-sig") as f:
              s = f.read()
          s = s.lstrip()
          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
          print("Removed leading whitespace from manifest.")
          PY

          
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LazzyManager-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
