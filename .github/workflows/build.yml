
name: Build Lazzy Manager V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract V2 source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi

          echo "Found source: $ZIP"
          mkdir extracted
          unzip -o "$ZIP" -d extracted

          if [ ! -f extracted/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts not found at ZIP root."
            exit 1
          fi

          cp -R extracted/. .
          rm -rf extracted

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LazzyManager-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
